services:
  postgres:
    container_name: postgres
    image: postgres:14
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  zookeeper:
    container_name: zookeeper
    image: confluentinc/cp-zookeeper:5.5.3
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    container_name: kafka
    image: confluentinc/cp-enterprise-kafka:5.5.3
    depends_on: [zookeeper]
    environment:
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_BROKER_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9991
    ports:
      - "9092:9092"

  redis:
    container_name: redis
    image: redis:7
    ports:
      - "6379:6379"

  api:
    container_name: api
    image: api-img:latest
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres?schema=public
      - KAFKA_CLIENT_ID=transaction-service
      - KAFKA_BROKERS=kafka:29092
      - REDIS_URL=redis://redis:6379
      - KAFKA_CONSUMER_GROUP_ID=transaction-service-group
    depends_on:
      - postgres
      - kafka
      - redis
    volumes:
      - ./api:/app
      - /app/node_modules

  anti-fraud:
    container_name: anti-fraud
    image: anti-fraud-img:latest
    build:
      context: ./anti-fraud
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - KAFKA_CLIENT_ID=anti-fraud-service
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_CONSUMER_GROUP_ID=anti-fraud-group
    depends_on:
      - kafka
    volumes:
      - ./anti-fraud:/app
      - /app/node_modules
